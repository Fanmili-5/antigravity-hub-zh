name: 兼容性或翻译反馈
description: 报告安装失败、还原失败、漏译或误译
body:
  - type: input
    id: environment
    attributes:
      label: Hub 版本、macOS 版本和芯片架构
      placeholder: "2.34.0 / macOS 26.5.1 / Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: 发生了什么
      description: "写明界面位置、复现步骤、预期和实际结果。请先移除账号、会话、用户路径和密钥信息。"
    validations:
      required: true
  - type: input
    id: check
    attributes:
      label: 兼容性检查结果
      description: "安装类问题可附 ./install.sh --check 的已脱敏结果。"
  - type: input
    id: scope
    attributes:
      label: 界面位置或文字指纹（选填）
      description: "漏译可提交控件位置、短标签、中文建议或文字指纹。"
