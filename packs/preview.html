<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__NAME__ · 套装预览</title>
<style>
:root{--ink:#263348;--accent:__TINT__;--blur:__BLUR__px;--veil:__VEIL__}
*{box-sizing:border-box}
body{margin:0;background:#eef2f8;color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:980px;margin:auto;padding:clamp(22px,5vw,52px) 20px}
h1{font-size:clamp(27px,5vw,44px);margin:0;line-height:1.2;overflow-wrap:anywhere}
p{margin:8px 0 20px;color:#465972}
section{position:relative;isolation:isolate;overflow:hidden;min-height:420px;border-radius:22px;display:grid;align-items:end;grid-template-columns:minmax(150px,.85fr) minmax(180px,1.5fr);gap:18px;padding:clamp(14px,4vw,34px);background:#a7adc8}
section::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(rgb(245 247 255/var(--veil)),rgb(245 247 255/var(--veil))),url(data:image/jpeg;base64,__PICTURE__) center/cover no-repeat}
.glass{padding:18px;border:1px solid #ffffff96;min-height:120px;background:rgb(250 251 255/.24);backdrop-filter:blur(var(--blur));border-radius:15px}
.glass strong{display:block;margin-bottom:6px}
.pet{background-image:url(data:image/png;base64,__ATLAS__);background-size:100%;aspect-ratio:1;width:100%;max-width:280px;justify-self:center;filter:drop-shadow(0 12px 10px #1d2c4d3d)}
.poses .pet{background-size:200% 200%}
dl{display:flex;gap:16px;flex-wrap:wrap;margin:0}
dt{color:#45566c}
dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}
@media(max-width:560px){section{grid-template-columns:1fr;min-height:320px}.pet{max-width:150px;grid-row:1}.glass{min-height:auto}}
</style>
</head>
<body>
<main><h1>__NAME__</h1><p>外观套装预览</p>
<section class="__LAYOUT__" aria-label="壁纸、磨砂与桌宠组合">
  <div class="glass"><strong>__PET__</strong><dl><div><dt>遮罩</dt><dd id="veil"></dd></div><div><dt>磨砂</dt><dd>__BLUR__ px</dd></div></dl></div>
  <div class="pet" role="img" aria-label="__PET__"></div>
</section></main>
<script>document.getElementById("veil").textContent=Math.round(__VEIL__*100)+"%";</script>
</body>
</html>
